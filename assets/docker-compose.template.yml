# Adaptar a scripts/rutas reales. Elegir versiones mantenidas y fijarlas en .env.
# DB privada por defecto. Debug opcional: añadir ports loopback 5433:5432 mediante override.
services:
  db:
    image: ${POSTGRES_IMAGE:?Define una imagen PostgreSQL versionada}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define clave local unica}
    volumes:
      - db_data:${POSTGRES_DATA_PATH:?Define ruta de datos de la version elegida}
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Define imagen Node mantenida}
    environment:
      PORT: '4000'
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Define URL con db y puerto interno}
    depends_on:
      db: {condition: service_healthy}
    networks: [edge, data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health',{signal:AbortSignal.timeout(2500)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Define imagen Node mantenida}
        API_INTERNAL_URL: http://api:4000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports: ['127.0.0.1:${WEB_HOST_PORT:-3100}:3000']
    depends_on:
      api: {condition: service_healthy}
    networks: [edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
networks:
  edge: {}
  data: {internal: true}
volumes:
  db_data: {}
